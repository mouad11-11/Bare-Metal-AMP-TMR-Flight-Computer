<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="dfd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1E293B" />
    </marker>
    <marker id="dfd-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
    <!-- Dot grid pattern -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#CBD5E1" opacity="0.6" />
    </pattern>
    <!-- Drop shadow for pills -->
    <filter id="pill-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Whiteboard Canvas -->
  <rect width="1080" height="620" fill="#FFFFFF" rx="12" />
  <rect width="1080" height="620" fill="url(#dot-grid)" rx="12" />
  <rect x="2" y="2" width="1076" height="616" fill="none" stroke="#E2E8F0" stroke-width="2" rx="10" />

  <!-- HEADER -->
  <text x="35" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#0F172A" letter-spacing="0.2">
    BARE-METAL AMP TMR FLIGHT COMPUTER — DATA FLOW DIAGRAM (DFD)
  </text>
  <text x="35" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748B">
    Interactive Quad-Core Multiprocessing Dataflow · Real-Time 2oo3 Voting · Dual-Rail Lockstep Verification
  </text>

  <!-- ======================================================== -->
  <!-- EXTERNAL ENTITIES (YELLOW ROUNDED RECTANGLES) -->
  <!-- ======================================================== -->

  <!-- Entity 1: Sensor & Gyro Feedback (Top Left) -->
  <g transform="translate(35, 100)">
    <rect width="130" height="70" rx="8" fill="#FACC15" stroke="#1E293B" stroke-width="2" />
    <text x="65" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Flight Sensors</text>
    <text x="65" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" fill="#1E293B" text-anchor="middle">&amp; Gyro (Pitch Rate)</text>
  </g>

  <!-- Entity 2: Commanded Actuator (Top Right) -->
  <g transform="translate(900, 100)">
    <rect width="145" height="70" rx="8" fill="#FACC15" stroke="#1E293B" stroke-width="2" />
    <text x="72" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Flight Actuators</text>
    <text x="72" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" fill="#1E293B" text-anchor="middle">(1000 - 2000 μs PWM)</text>
  </g>

  <!-- Entity 3: Emergency Safe-State (Bottom Right) -->
  <g transform="translate(900, 480)">
    <rect width="145" height="70" rx="8" fill="#FACC15" stroke="#1E293B" stroke-width="2" />
    <text x="72" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Predefined Fail-Safe</text>
    <text x="72" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" fill="#991B1B" text-anchor="middle">-9999 μs (Safe State)</text>
  </g>


  <!-- ======================================================== -->
  <!-- PROCESSES (CIRCULAR SKY BLUE NODES WITH BLACK BORDERS) -->
  <!-- ======================================================== -->

  <!-- Process 1.0: Sensor Ingest & Frame Dispatch (Core 0) -->
  <g transform="translate(250, 135)">
    <circle cx="0" cy="0" r="46" fill="#60A5FA" stroke="#1E293B" stroke-width="2.2" />
    <text x="0" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">1.0</text>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Sensor Ingest</text>
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="500" fill="#1E293B" text-anchor="middle">&amp; Dispatch</text>
  </g>

  <!-- Process 2.1: Node 1 Flight Law (Core 1) -->
  <g transform="translate(460, 110)">
    <circle cx="0" cy="0" r="42" fill="#60A5FA" stroke="#1E293B" stroke-width="2.2" />
    <text x="0" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">2.1</text>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Node 1 (Core 1)</text>
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="500" fill="#1E293B" text-anchor="middle">Proportional Kp</text>
  </g>

  <!-- Process 2.2: Node 2 Diverse Flight Law (Core 2) -->
  <g transform="translate(460, 240)">
    <circle cx="0" cy="0" r="44" fill="#60A5FA" stroke="#1E293B" stroke-width="2.2" />
    <text x="0" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">2.2</text>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Node 2 Diverse</text>
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="600" fill="#065F46" text-anchor="middle">Q15 Fixed-Point</text>
  </g>

  <!-- Process 2.3: Node 3 Flight Law (Core 3) -->
  <g transform="translate(460, 370)">
    <circle cx="0" cy="0" r="42" fill="#60A5FA" stroke="#1E293B" stroke-width="2.2" />
    <text x="0" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">2.3</text>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Node 3 (Core 3)</text>
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="500" fill="#1E293B" text-anchor="middle">Proportional Kp</text>
  </g>

  <!-- Process 3.0: 2oo3 Median Voter (Core 0) -->
  <g transform="translate(710, 240)">
    <circle cx="0" cy="0" r="46" fill="#60A5FA" stroke="#1E293B" stroke-width="2.2" />
    <text x="0" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">3.0</text>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">2oo3 Voter</text>
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="600" fill="#1E293B" text-anchor="middle">median3 (|Δ|≤5)</text>
  </g>


  <!-- ======================================================== -->
  <!-- DATA STORES (OPEN-ENDED RECTANGULAR BRACKETS [| NAME |]) -->
  <!-- ======================================================== -->

  <!-- Store 1: Hardware Memory Zones (Top Center) -->
  <g transform="translate(230, 260)">
    <path d="M 120 0 L 10 0 L 10 50 L 120 50" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
    <line x1="22" y1="0" x2="22" y2="50" stroke="#1E293B" stroke-width="2" />
    <text x="65" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Hardware Zones</text>
    <text x="65" y="40" font-family="monospace" font-size="9" fill="#0369A1" text-anchor="middle">0x81M, 0x82M, 0x83M</text>
  </g>

  <!-- Store 2: 3-Slot Tri-Buffered Mailboxes -->
  <g transform="translate(560, 110)">
    <path d="M 130 0 L 10 0 L 10 50 L 130 50" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
    <line x1="22" y1="0" x2="22" y2="50" stroke="#1E293B" stroke-width="2" />
    <text x="75" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Tri-Buffer Mailbox</text>
    <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#0F766E" text-anchor="middle">3-Slot Lock-Free + CRC</text>
  </g>

  <!-- Store 3: Node Health & Latch Accumulator -->
  <g transform="translate(560, 360)">
    <path d="M 130 0 L 10 0 L 10 50 L 130 50" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
    <line x1="22" y1="0" x2="22" y2="50" stroke="#1E293B" stroke-width="2" />
    <text x="75" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Node Health</text>
    <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#B45309" text-anchor="middle">Leaky-Bucket (N=3, M=100)</text>
  </g>


  <!-- ======================================================== -->
  <!-- DUAL-RAIL LOCKSTEP PROCESS PILL (ORANGE / PEACH OVAL) -->
  <!-- ======================================================== -->
  <g transform="translate(710, 480)" filter="url(#pill-shadow)">
    <rect x="-85" y="-24" width="170" height="48" rx="24" fill="#FED7AA" stroke="#EA580C" stroke-width="2" />
    <text x="0" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="800" fill="#9A3412" text-anchor="middle">4.0 Lockstep Rail B</text>
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600" fill="#C2410C" text-anchor="middle">Independent Check</text>
  </g>


  <!-- ======================================================== -->
  <!-- CONNECTING LINES & DATA FLOW LABELS -->
  <!-- ======================================================== -->

  <!-- Sensor -> Process 1.0 -->
  <line x1="165" y1="135" x2="204" y2="135" stroke="#1E293B" stroke-width="1.8" marker-end="url(#dfd-arrow)" />
  <text x="185" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#475569" text-anchor="middle">Pitch rate</text>

  <!-- Process 1.0 -> Hardware Zones Store -->
  <line x1="250" y1="181" x2="250" y2="260" stroke="#1E293B" stroke-width="1.8" marker-end="url(#dfd-arrow)" />
  <text x="256" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#475569">Zone Ingest</text>

  <!-- Hardware Zones -> Cores 1, 2, 3 -->
  <path d="M 350 285 L 390 285 L 390 110 L 418 110" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#dfd-arrow)" />
  <path d="M 350 285 L 380 285 L 380 240 L 416 240" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#dfd-arrow)" />
  <path d="M 350 285 L 390 285 L 390 370 L 418 370" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#dfd-arrow)" />
  <text x="365" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#475569">Read Zone</text>

  <!-- Cores 1, 2, 3 -> Tri-Buffer Mailbox Store -->
  <path d="M 502 110 L 570 110" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#dfd-arrow)" />
  <path d="M 504 240 L 540 240 L 540 135 L 570 135" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#dfd-arrow)" />
  <path d="M 502 370 L 550 370 L 550 150 L 570 150" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#dfd-arrow)" />
  <text x="525" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#475569">y1, y2, y3</text>

  <!-- Tri-Buffer Mailbox -> Process 3.0 Voter -->
  <path d="M 690 135 L 710 135 L 710 194" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#dfd-arrow)" />
  <text x="720" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#475569">Sync read</text>

  <!-- Process 3.0 Voter -> Process 4.0 Lockstep -->
  <line x1="710" y1="286" x2="710" y2="456" stroke="#1E293B" stroke-width="1.8" marker-end="url(#dfd-arrow)" />
  <text x="718" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#475569">Voter Result</text>

  <!-- Process 3.0 Voter <-> Health Store -->
  <line x1="680" y1="270" x2="630" y2="360" stroke="#1E293B" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#dfd-arrow)" />
  <text x="630" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#B45309">Health latch</text>

  <!-- Process 4.0 Lockstep -> Commanded Actuator (Nominal) -->
  <path d="M 795 480 L 860 480 L 860 135 L 900 135" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#dfd-arrow)" />
  <text x="865" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600" fill="#15803D">Verified PWM</text>

  <!-- Process 4.0 Lockstep -> Emergency Fail-Safe (Mismatch) -->
  <line x1="795" y1="515" x2="900" y2="515" stroke="#DC2626" stroke-width="2" marker-end="url(#dfd-arrow-red)" />
  <text x="848" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Trip SAFE</text>


  <!-- ======================================================== -->
  <!-- COLLABORATOR CURSORS & AVATAR PILLS (MIRO / FIGJAM STYLE)-->
  <!-- ======================================================== -->

  <!-- Pill 1: Core 0 (Arbiter) - Purple near Voter -->
  <g transform="translate(770, 70)" filter="url(#pill-shadow)">
    <!-- Cursor Arrow -->
    <path d="M 0 0 L 14 6 L 8 9 L 12 18 L 9 19 L 5 10 L 0 13 z" fill="#6366F1" />
    <!-- Pill Label -->
    <rect x="14" y="8" width="105" height="26" rx="13" fill="#6366F1" />
    <text x="66" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Core 0: Arbiter</text>
  </g>

  <!-- Pill 2: Core 1 (Node 1) - Blue near Node 1 -->
  <g transform="translate(340, 65)" filter="url(#pill-shadow)">
    <path d="M 0 0 L 14 6 L 8 9 L 12 18 L 9 19 L 5 10 L 0 13 z" fill="#3B82F6" />
    <rect x="14" y="8" width="100" height="26" rx="13" fill="#3B82F6" />
    <text x="64" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Core 1: Node 1</text>
  </g>

  <!-- Pill 3: Core 2 (Diverse) - Orange/Amber near Node 2 -->
  <g transform="translate(340, 205)" filter="url(#pill-shadow)">
    <path d="M 0 0 L 14 6 L 8 9 L 12 18 L 9 19 L 5 10 L 0 13 z" fill="#F97316" />
    <rect x="14" y="8" width="112" height="26" rx="13" fill="#F97316" />
    <text x="70" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Core 2: Q15 ALU</text>
  </g>

  <!-- Pill 4: Core 3 (Node 3) - Pink near Node 3 -->
  <g transform="translate(340, 395)" filter="url(#pill-shadow)">
    <path d="M 0 0 L 14 6 L 8 9 L 12 18 L 9 19 L 5 10 L 0 13 z" fill="#EC4899" />
    <rect x="14" y="8" width="100" height="26" rx="13" fill="#EC4899" />
    <text x="64" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Core 3: Node 3</text>
  </g>


  <!-- ======================================================== -->
  <!-- SPEECH BUBBLES / STICKY NOTES (FIGJAM WHITEBOARD CHIPS) -->
  <!-- ======================================================== -->

  <!-- Sticky Note: Zero Heap / Static Linkage (Bottom Left) -->
  <g transform="translate(45, 480)" filter="url(#pill-shadow)">
    <rect width="135" height="55" rx="6" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.4" />
    <circle cx="15" cy="15" r="3" fill="#A16207" />
    <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700" fill="#854D0E">Zero Heap (No malloc)</text>
    <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#713F12">Static memory map only.</text>
    <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#713F12">Stack Canaries: 0xDEADBEEF</text>
  </g>

  <!-- Comment Bubble 1: CFI Token Transition Check -->
  <g transform="translate(485, 30)">
    <rect width="140" height="28" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1.2" />
    <path d="M 525 58 L 530 65 L 535 58 z" fill="#E0E7FF" stroke="#6366F1" stroke-width="1.2" />
    <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600" fill="#3730A3">💬 CFI: 0xF006 COMPLETE</text>
  </g>

  <!-- Comment Bubble 2: Bounded Majority Bound -->
  <g transform="translate(735, 185)">
    <rect width="125" height="26" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2" />
    <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700" fill="#92400E">📌 Bound: |Δ| ≤ 5 μs</text>
  </g>
</svg>
