<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A13" />
      <stop offset="50%" stop-color="#0D1527" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Glowing Radar Rings on Right -->
  <circle cx="1020" cy="210" r="160" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.15" />
  <circle cx="1020" cy="210" r="110" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.25" />
  <circle cx="1020" cy="210" r="60" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.3" />
  <circle cx="1020" cy="210" r="4" fill="#10B981" filter="url(#glow)" />
  
  <!-- Left Side Badges / Chips -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" opacity="0.9" />
    <circle cx="15" cy="15" r="5" fill="#10B981" />
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">ARMv7-A · QUAD-CORE AMP</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    Bare-Metal AMP <tspan fill="url(#cyan-glow)">TMR Flight Computer</tspan>
  </text>
  
  <!-- Sub-headline -->
  <text x="60" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
    Software-Implemented Fault Tolerance (SIFT) · 2oo3 Median Voting · Hardware Spatial Memory Zones
  </text>

  <!-- 4 Feature Cards Across Bottom -->
  <!-- Card 1: Cores -->
  <g transform="translate(60, 225)">
    <rect width="250" height="140" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
    <rect x="18" y="16" width="36" height="36" rx="8" fill="#0EA5E9" fill-opacity="0.15" />
    <text x="36" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" text-anchor="middle" fill="#38BDF8">⚡</text>
    <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="700" fill="#E2E8F0">4 Asymmetric Cores</text>
    <text x="66" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="500" fill="#64748B">Core 0 Arbiter + Cores 1-3</text>
    <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#94A3B8">Dedicated pinned nodes</text>
    <text x="18" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#94A3B8">Zero RTOS / bare-metal</text>
    <text x="18" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" fill="#38BDF8">500k-Cycle Watchdog →</text>
  </g>

  <!-- Card 2: 2oo3 Voter -->
  <g transform="translate(330, 225)">
    <rect width="250" height="140" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
    <rect x="18" y="16" width="36" height="36" rx="8" fill="#F59E0B" fill-opacity="0.15" />
    <text x="36" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" text-anchor="middle" fill="#FBBF24">⚖️</text>
    <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="700" fill="#E2E8F0">2oo3 Median Voter</text>
    <text x="66" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="500" fill="#64748B">Bounded Consensus</text>
    <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#94A3B8">|Δ| ≤ 5 μs agreement bound</text>
    <text x="18" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#94A3B8">Chain ambiguity resolved</text>
    <text x="18" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" fill="#FBBF24">Dual-Threshold Latch →</text>
  </g>

  <!-- Card 3: Spatial Partitioning -->
  <g transform="translate(600, 225)">
    <rect width="250" height="140" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
    <rect x="18" y="16" width="36" height="36" rx="8" fill="#10B981" fill-opacity="0.15" />
    <text x="36" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" text-anchor="middle" fill="#34D399">🛡️</text>
    <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="700" fill="#E2E8F0">Spatial Partitioning</text>
    <text x="66" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="500" fill="#64748B">Physical RAM Isolation</text>
    <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#94A3B8">Zones at 0x81M, 0x82M, 0x83M</text>
    <text x="18" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#94A3B8">ARMv7 MMU page protection</text>
    <text x="18" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" fill="#34D399">Lock-Free Tri-Buffer →</text>
  </g>

  <!-- Card 4: Verification -->
  <g transform="translate(870, 225)">
    <rect width="270" height="140" rx="12" fill="url(#card-grad)" stroke="#10B981" stroke-width="1.4" />
    <rect x="18" y="16" width="36" height="36" rx="8" fill="#10B981" fill-opacity="0.2" />
    <text x="36" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" text-anchor="middle" fill="#34D399">✓</text>
    <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="700" fill="#E2E8F0">246,122 Assertions</text>
    <text x="66" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="500" fill="#34D399">100% Passing in CI</text>
    <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#94A3B8">11 Native C Test Suites</text>
    <text x="18" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#94A3B8">113-Vector Fault Campaign</text>
    <text x="18" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" fill="#38BDF8">Dual-Rail Lockstep Verified →</text>
  </g>
</svg>
